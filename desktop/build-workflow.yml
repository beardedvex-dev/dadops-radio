# Builds the Windows installer and puts it on a GitHub release.
# Run it from GitHub: Actions > "Build desktop app" > Run workflow.
# The version comes from desktop/package.json; bump it before each build.
name: Build desktop app

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Check the radio address is filled in
        shell: pwsh
        run: |
          $c = Get-Content config.json -Raw | ConvertFrom-Json
          if ($c.radioUrl -match "REPLACE-ME") { Write-Error "Put your radio address in desktop/config.json first."; exit 1 }
      - run: npm ci
      - name: Build and publish the installer
        run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
